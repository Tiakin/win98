<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Now Playing - Win98</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Courier New", monospace;
            background-color: transparent;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 420px;
            background-color: #c0c0c0;
            display: flex;
            flex-direction: column;
            padding: 5px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .title-bar {
            background-color: #000080;
            color: white;
            padding: 2px 5px;
            font-size: 14px;
            display: flex;
            align-items: center;
            height: 24px;
            border-bottom: 2px solid #808080;
        }

        .content {
            display: flex;
            flex-direction: row;
            gap: 5px;
            padding: 5px;
        }

        .cover {
            width: 100px;
            height: 100px;
            border: 2px solid #000;
            object-fit: cover;
        }

        .content-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .music-body {
            flex: 1;
            background-color: #000;
            padding: 5px;
            color: white;
            border: 2px solid #808080;
            box-shadow: inset -2px -2px #fff, inset 2px 2px #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 80px;
        }

        .title {
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: white;
        }

        .artist {
            font-size: 14px;
            color: #a0a0a0;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-bar-container {
            display: flex;
            align-items: center;
            background-color: #c0c0c0;
            padding: 2px;
            height: 20px;
        }

        .progress-bar {
            flex: 1;
            background-color: #808080;
            height: 8px;
            position: relative;
            border: 1px solid #000;
        }

        .progress-bar-handle {
            width: 12px;
            height: 16px;
            background-color: #c0c0c0;
            border: 2px solid #000;
            position: absolute;
            left: 0%;
            transform: translateX(-50%);
            top: -4px;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="title-bar">Music_Player.exe</div>
        <div class="content">
            <img id="cover" class="cover" src="" alt="Album Cover">
            <div class="content-right">
                <div class="music-body">
                    <div class="title" id="title"></div>
                    <div class="artist" id="artist"></div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar">
                        <div class="progress-bar-handle"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const cover = document.getElementById('cover');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const progressHandle = document.querySelector('.progress-bar-handle');

        function updateTrack(data) {
            if (data.title) {
                title.textContent = data.title;
                artist.textContent = data.artist || 'Unknown Artist';
                if (data.coverUrl) {
                    cover.src = data.coverUrl;
                } else {
                    cover.src = '';
                }

                const duration = Number(data.duration);
                const elapsedTime = Number(data.elapsedTime);
                const progress = duration > 0 && Number.isFinite(elapsedTime)
                    ? Math.min(Math.max(elapsedTime / duration, 0), 1)
                    : 0;
                progressHandle.style.left = `${progress * 100}%`;

                container.classList.add('visible');
            }
        }

        const eventSource = new EventSource('/api/stream');

        eventSource.addEventListener('track', (event) => {
            const data = JSON.parse(event.data);
            updateTrack(data);
        });

        fetch('/api/now-playing')
            .then(res => res.json())
            .then(updateTrack)
            .catch(console.error);
    </script>
</body>
</html>
